name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      # Signed with the committed throwaway keystore (ci/debug.keystore) so every build
      # shares one signature and installs over the previous one. No secrets involved.
      - name: Build release APK
        run: ./gradlew assembleRelease --console=plain

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Recon.apk

      - name: Checksum
        id: meta
        run: echo "sha=$(sha256sum Recon.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Move the rolling tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Publish rolling pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build"
          prerelease: true
          make_latest: false
          files: Recon.apk
          body: |
            Rolling build of `${{ github.sha }}` — sideload `Recon.apk`; it installs over the previous build, or use Settings → Updates in the app.
            build: ${{ github.run_number }}
            sha256: ${{ steps.meta.outputs.sha }}
