name: Site health
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_sites.py | tee site-health.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-health
          path: site-health.txt
