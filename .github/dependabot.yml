# Weekly version updates (also security updates once "Dependabot alerts" is on in Settings -> Code security).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      androidx: { patterns: ["androidx.*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
